# Kotlin conversion: build, test and validate the data on every change to the Kotlin code or Data/.
name: Kotlin

on:
  push:
    paths: [ "kotlin/**", "Data/**", ".github/workflows/kotlin.yml" ]
  pull_request:
    paths: [ "kotlin/**", "Data/**", ".github/workflows/kotlin.yml" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Builds every target (JVM and Android) and runs all tests.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Validate Data folder
        run: ./gradlew :tools:validate:run --console=plain
